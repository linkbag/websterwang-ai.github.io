// Used unchanged inside the offline HTML export as well as in Studio.
function createMysteryView() {
  const tag = (kind, cls, text) => {
    const el = document.createElement(kind);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  };
  const button = (text, click, cls = "") => {
    const el = tag("button", cls, text);
    el.type = "button";
    el.addEventListener("click", click);
    return el;
  };
  const text = (v, lang) => v?.[lang] || v?.[lang === "zh" ? "en" : "zh"] || "";
  const material = (p, id) => p.materials?.find((m) => m.id === id);
  const src = (m) =>
    m &&
    ["image", "audio", "video"].includes(m.kind) &&
    typeof m.data === "string" &&
    m.data.startsWith("data:" + m.kind + "/") &&
    m.data.slice(0, 128).includes(";base64,")
      ? m.data
      : "";
  const rectStyle = (el, r) =>
    Object.assign(el.style, {
      left: r.x * 100 + "%",
      top: r.y * 100 + "%",
      width: r.w * 100 + "%",
      height: r.h * 100 + "%",
    });
  function frame(background, fallbackLabel) {
    const outer = tag("div", "my-frame");
    const picture = tag("div", "my-picture");
    let ratio = 16 / 9,
      closed = false;
    const fit = () => {
      if (closed) return;
      const { width, height } = outer.getBoundingClientRect();
      const w = Math.min(width, height * ratio),
        h = w / ratio;
      Object.assign(picture.style, { width: w + "px", height: h + "px" });
    };
    if (src(background)) {
      const img = tag("img", "my-backdrop");
      img.alt = "";
      img.draggable = false;
      img.onload = () => {
        if (img.naturalWidth && img.naturalHeight) {
          ratio = img.naturalWidth / img.naturalHeight;
          fit();
        }
      };
      img.src = src(background);
      picture.append(img);
    } else picture.append(tag("span", "my-empty-art", fallbackLabel));
    outer.append(picture);
    const observer = new ResizeObserver(fit);
    observer.observe(outer);
    return {
      outer,
      picture,
      dispose() {
        closed = true;
        observer.disconnect();
      },
    };
  }
  return { tag, button, text, material, src, rectStyle, frame };
}

const step=(function(){
// Each action checks the current clues before it changes a flag or reaches an ending.
function mysteryStep(p, state, hotspotId, actionId) {
  const hotspot = p.hotspots.find((h) => h.id === hotspotId);
  const action = hotspot?.actions.find((a) => a.id === actionId);
  if (!action || state.ending) return state;
  const blocked =
    action.requires &&
    state.flags.includes(action.requires) !== (action.requiresState === "set");
  const last = { hotspotId, actionId, blocked: Boolean(blocked) };
  if (blocked) return { ...state, last };
  const flags = new Set(state.flags);
  if (action.effect) {
    if (action.effectState === "set") flags.add(action.effect);
    else flags.delete(action.effect);
  }
  return { flags: [...flags].sort(), ending: action.ending, last };
}

function runMysteryPlayer(

  let state = { flags: [], ending: "", last: null },

  let backgroundAudio,
